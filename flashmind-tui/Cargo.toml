[package]
name = "flashmind-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TUI primitives for building interactive agent CLIs with Flashmind"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-tui"
keywords = ["ai", "agent", "tui", "terminal"]
categories = ["command-line-interface"]
exclude.workspace = true

[features]
default = []
full = ["markdown"]
markdown = ["dep:nom", "dep:nu-ansi-term", "dep:regex", "dep:comfy-table", "dep:ansi-to-tui"]

[dependencies]
flashmind-types = { workspace = true }
rust_decimal = { workspace = true }
ratatui = { workspace = true }
unicode-width = "0.2"
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }

# Optional deps for `markdown` feature
nom = { workspace = true, optional = true }
nu-ansi-term = { version = "0.50", optional = true }
regex = { workspace = true, optional = true }
comfy-table = { version = "7", optional = true, features = ["custom_styling"] }
ansi-to-tui = { version = "8", optional = true }
