[package]
name = "flashmind-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TUI primitives for building interactive agent CLIs with Flashmind"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-tui"
keywords = ["ai", "agent", "tui", "terminal"]
categories = ["command-line-interface"]
exclude.workspace = true

[features]
default = []
full = ["markdown"]
markdown = ["dep:nom", "dep:nu-ansi-term", "dep:regex", "dep:comfy-table", "dep:ansi-to-tui"]

[dependencies]
flashmind-types = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
ratatui = { workspace = true }
unicode-width = "0.2"
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
crossterm = { version = "0.29", features = ["event-stream"] }
base64 = { workspace = true }
humantime = "2.4"

# Native clipboard access is unavailable on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Optional deps for `markdown` feature
nom = { workspace = true, optional = true }
nu-ansi-term = { version = "0.50", optional = true }
regex = { workspace = true, optional = true }
comfy-table = { version = "8", optional = true, features = ["custom_styling"] }
ansi-to-tui = { version = "8", optional = true, default-features = false }
