[package]
name = "flashmind-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "AI chat & coding agent powered by flashmind"

[[bin]]
name = "flashmind"
path = "src/main.rs"

[dependencies]
flashmind-core = { workspace = true }
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true }
flashmind-tools = { workspace = true, features = ["mcp"] }
flashmind-memory = { workspace = true, features = ["session"] }
flashmind-prompts = { workspace = true }
flashmind-skills = { workspace = true }
flashmind-tui = { workspace = true, features = ["markdown"] }
ratatui = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-rusqlite = { workspace = true }
futures = { workspace = true }

clap = { workspace = true, features = ["derive"] }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
