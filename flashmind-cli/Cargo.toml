[package]
name = "flashmind-cli"
publish = false
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
keywords = ["ai", "agent", "cli", "llm"]
categories = ["command-line-utilities"]
description = "AI chat & coding agent powered by flashmind"

[[bin]]
name = "flsh"
path = "src/main.rs"

[features]
default = ["acp", "openai-login", "clipboard", "mistral-realtime", "markdown", "fuzzy-completion", "http-compression", "http2", "request-compression"]
acp = ["dep:agent-client-protocol"]
openai-login = ["dep:jsonwebtoken"]
clipboard = ["flashmind-tui/clipboard"]
mistral-realtime = ["flashmind-llm/mistral-realtime"]
markdown = ["flashmind-tui/markdown"]
fuzzy-completion = ["dep:nucleo-matcher"]
http-compression = ["flashmind-llm/http-compression", "flashmind-tools/http-compression"]
http2 = ["flashmind-llm/http2", "flashmind-tools/http2"]
request-compression = ["flashmind-llm/request-compression"]

[dependencies]
flashmind-core = { workspace = true }
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true, default-features = false }
flashmind-tools = { workspace = true, features = ["subagent", "lsp"] }
flashmind-memory = { workspace = true, features = ["session"] }
flashmind-skills = { workspace = true }
flashmind-tui = { workspace = true, default-features = false }
ratatui = { workspace = true }
rustls = { workspace = true }

async-trait = { workspace = true }
agent-client-protocol = { version = "3.6", features = ["stdio"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs"] }
tokio-rusqlite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "rustls-no-provider"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"], optional = true }
sha2 = "0.11"
self-replace = "1.5"
secrecy = "0.10"

clap = { workspace = true, features = ["derive"] }
clap_complete = "4"
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
anyhow = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
base64 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
nucleo-matcher = { workspace = true, optional = true }
strum = { workspace = true }

tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
tokio-util = { workspace = true }
