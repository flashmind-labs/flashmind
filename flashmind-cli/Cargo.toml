[package]
name = "flashmind-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
keywords = ["ai", "agent", "cli", "llm"]
categories = ["command-line-utilities"]
description = "AI chat & coding agent powered by flashmind"

[[bin]]
name = "flsh"
path = "src/main.rs"

[dependencies]
flashmind-core = { workspace = true }
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true }
flashmind-tools = { workspace = true, features = ["subagent", "lsp"] }
flashmind-memory = { workspace = true, features = ["session"] }
flashmind-skills = { workspace = true }
flashmind-tui = { workspace = true, features = ["markdown"] }
ratatui = { workspace = true }
rustls = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-rusqlite = { workspace = true }
futures-util = { workspace = true }

clap = { workspace = true, features = ["derive"] }
clap_complete = "4"
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
anyhow = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
base64 = { workspace = true }
uuid = { workspace = true }
ignore = { workspace = true }
glob = { workspace = true }
nucleo-matcher = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-util = { workspace = true }
