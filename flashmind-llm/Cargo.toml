[package]
name = "flashmind-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LLM provider implementations for the Flash AI agent runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-llm"
keywords = ["ai", "llm", "openai", "anthropic"]
categories = ["api-bindings", "development-tools"]
exclude.workspace = true

[features]
default = []
full = []

[dependencies]
flashmind-types = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "io-util"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# HTTP
reqwest = { workspace = true, features = ["charset", "deflate", "gzip", "http2", "json", "multipart", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { workspace = true }
webpki-roots = { workspace = true }
eventsource-stream = "0.2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
rust_decimal = { workspace = true, features = ["serde-arbitrary-precision"] }

# Rate limiting
ratelimit = { workspace = true }

# Compression
flate2 = "1"

# Encoding
base64 = { workspace = true }

# Misc
tracing = { workspace = true }
metrics = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
ctor = "0.4"
