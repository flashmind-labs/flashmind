[package]
name = "flashmind-llm"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
description = "LLM provider implementations for the Flashmind AI agent framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-llm"
keywords = ["ai", "llm", "openai", "anthropic", "mistral"]
categories = ["api-bindings", "development-tools"]
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["mistral-realtime", "http-compression", "http2", "request-compression"]
full = ["mistral-realtime", "http-compression", "http2", "request-compression"]
mistral-realtime = ["dep:tokio-rustls", "dep:yawc"]
http-compression = ["reqwest/deflate", "reqwest/gzip"]
http2 = ["reqwest/http2"]
request-compression = ["dep:flate2"]

[dependencies]
flashmind-types = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "io-util", "fs", "macros", "rt"] }
tokio-util = { workspace = true, features = ["io"] }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }

# HTTP
reqwest = { workspace = true, features = ["charset", "json", "multipart", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { workspace = true }
webpki-roots = { workspace = true }
eventsource-stream = "0.2"
tokio-rustls = { version = "0.26", default-features = false, optional = true }
yawc = { version = "0.5", default-features = false, features = ["tls", "zlib"], optional = true }
bytes = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }

# Rate limiting
ratelimit = { workspace = true }

# Compression
flate2 = { version = "1", optional = true }

# Encoding
base64 = { workspace = true }

# Credentials
secrecy = "0.10"

# Misc
tracing = { workspace = true }
metrics = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ctor = "0.4"
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
