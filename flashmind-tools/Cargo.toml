[package]
name = "flashmind-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in tool implementations for the Flashmind AI agent framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-tools"
keywords = ["ai", "agent", "tools", "llm"]
categories = ["development-tools"]
exclude.workspace = true

[features]
default = ["subagent"]
full = [
    "mcp", "gmail", "google-calendar", "google-contacts", "outlook",
    "subagent", "caldav", "github", "slack",
    "redis", "postgres", "mysql", "clickhouse", "docker",
    "cloudflare", "messaging", "ssh", "kubernetes",
    "composio", "plot",
]
composio = []
mcp = ["dep:rmcp", "dep:oauth2"]
gmail = ["dep:jsonwebtoken", "dep:urlencoding"]
google-calendar = ["dep:jsonwebtoken", "dep:urlencoding"]
google-contacts = ["dep:jsonwebtoken", "dep:urlencoding"]
outlook = ["dep:urlencoding"]
caldav = ["dep:urlencoding", "dep:quick-xml"]
github = ["dep:urlencoding"]
slack = ["dep:urlencoding"]
subagent = ["flashmind-core/subagent"]
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls"]
mysql = ["dep:mysql_async"]
clickhouse = []
docker = ["dep:bollard"]
cloudflare = ["dep:urlencoding"]
messaging = ["dep:lettre"]
ssh = ["dep:russh", "dep:russh-keys"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:serde_yaml"]
plot = ["dep:plotters"]

[dependencies]
flashmind-types = { workspace = true }
flashmind-core = { workspace = true }
flashmind-skills = { workspace = true }

tokio = { workspace = true, features = ["sync", "time", "process", "fs", "io-util", "rt", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["charset", "deflate", "form", "gzip", "http2", "json", "query", "rustls-no-provider", "stream"] }
webpki-roots = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
similar = "3"
dashmap = "6"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
dirs = "6"
rand = { workspace = true }
ring = "0.17"
futures = { workspace = true, features = ["executor"] }
rmcp = { version = "2.1", optional = true, default-features = false, features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
oauth2 = { version = "5.0", optional = true, default-features = false }
jsonwebtoken = { version = "9", optional = true }
urlencoding = { version = "2", optional = true }
quick-xml = { version = "0.37", optional = true }
redis = { version = "0.29", optional = true, features = ["tokio-comp", "aio"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
mysql_async = { version = "0.35", optional = true, default-features = false, features = ["default-rustls-ring"] }
bollard = { version = "0.18", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
russh = { version = "0.46", optional = true }
russh-keys = { version = "0.46", optional = true }
kube = { version = "0.98", optional = true, default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.24", optional = true, features = ["latest"] }
serde_yaml = { workspace = true, optional = true }
plotters = { version = "0.3", optional = true, default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "area_series"] }
ratelimit = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
rusqlite = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
filetime = "0.2"
ctor = "0.4"
