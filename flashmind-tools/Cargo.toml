[package]
name = "flashmind-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Built-in tool implementations for the Flashmind AI assistant"
license = "MIT"
repository = "https://github.com/flashmind-labs/flashmind"
homepage = "https://github.com/flashmind-labs/flashmind"
documentation = "https://docs.rs/flashmind-tools"
keywords = ["ai", "agent", "tools", "llm"]
categories = ["development-tools"]
exclude = ["CLAUDE.md"]

[features]
default = ["subagent"]
full = [
    "mcp", "gmail", "google-calendar", "google-contacts", "outlook",
    "subagent", "caldav", "github", "slack",
    "redis", "postgres", "mysql", "clickhouse", "docker",
    "cloudflare", "messaging", "ssh", "kubernetes",
    "composio", "plot",
]
composio = []
mcp = ["dep:rmcp"]
gmail = ["dep:jsonwebtoken", "dep:urlencoding"]
google-calendar = ["dep:jsonwebtoken", "dep:urlencoding"]
google-contacts = ["dep:jsonwebtoken", "dep:urlencoding"]
outlook = ["dep:urlencoding"]
caldav = ["dep:urlencoding", "dep:quick-xml"]
github = ["dep:urlencoding"]
slack = ["dep:urlencoding"]
subagent = ["flashmind-core/subagent"]
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls"]
mysql = ["dep:mysql_async"]
clickhouse = []
docker = ["dep:bollard"]
cloudflare = ["dep:urlencoding"]
messaging = ["dep:lettre"]
ssh = ["dep:russh", "dep:russh-keys"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:serde_yaml"]
plot = ["dep:plotters"]

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
flashmind-core = { version = "0.1", path = "../flashmind-core" }

tokio = { version = "1", features = ["sync", "time", "process", "fs", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
metrics = "0.24"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "deflate", "form", "gzip", "http2", "json", "query", "rustls-no-provider", "stream"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
glob = "0.3"
similar = "3"
dashmap = "6"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
dirs = "6"
rand = "0.10"
ring = "0.17"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
rmcp = { version = "1.5", optional = true, default-features = false, features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
jsonwebtoken = { version = "9", optional = true }
urlencoding = { version = "2", optional = true }
quick-xml = { version = "0.37", optional = true }
redis = { version = "0.29", optional = true, features = ["tokio-comp", "aio"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
mysql_async = { version = "0.35", optional = true, default-features = false, features = ["default-rustls-ring"] }
bollard = { version = "0.18", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
russh = { version = "0.46", optional = true }
russh-keys = { version = "0.46", optional = true }
kube = { version = "0.98", optional = true, default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.24", optional = true, features = ["latest"] }
serde_yaml = { version = "0.9", optional = true }
plotters = { version = "0.3", optional = true, default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "area_series"] }
ratelimit = "2"
rust_decimal = "1"
rust_decimal_macros = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
filetime = "0.2"
ctor = "0.4"
