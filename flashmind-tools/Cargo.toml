[package]
name = "flashmind-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Built-in tool implementations for the Flashmind AI agent framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-tools"
keywords = ["ai", "agent", "tools", "llm"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["subagent", "sqlite", "skills", "http", "http-compression", "http2"]
full = [
    "mcp", "gmail", "google-calendar", "google-contacts", "outlook",
    "subagent", "caldav", "github", "slack",
    "redis", "postgres", "mysql", "clickhouse", "docker",
    "cloudflare", "messaging", "ssh", "kubernetes",
    "composio", "plot", "sqlite", "lsp", "skills", "http", "http-compression", "http2",
]
http = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:url", "dep:ratelimit"]
http-compression = ["reqwest?/deflate", "reqwest?/gzip"]
http2 = ["reqwest?/http2"]
composio = ["http"]
lsp = ["dep:url", "dep:strum"]
skills = ["dep:flashmind-skills"]
mcp = ["http", "dep:rmcp"]
gmail = ["http", "dep:jsonwebtoken", "dep:urlencoding", "reqwest/form"]
google-calendar = ["http", "dep:jsonwebtoken", "dep:urlencoding", "reqwest/form"]
google-contacts = ["http", "dep:jsonwebtoken", "dep:urlencoding", "reqwest/form"]
outlook = ["http", "dep:urlencoding", "reqwest/form"]
caldav = ["http", "dep:urlencoding", "dep:quick-xml", "reqwest/form"]
github = ["http", "dep:urlencoding", "reqwest/form"]
slack = ["http", "dep:urlencoding", "reqwest/form"]
subagent = ["dep:flashmind-core", "flashmind-core/subagent", "dep:serde_yaml"]
sqlite = ["dep:rusqlite"]
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
mysql = ["dep:mysql_async"]
clickhouse = ["http"]
docker = ["dep:bollard"]
cloudflare = ["http", "dep:urlencoding"]
messaging = ["http", "dep:lettre", "reqwest/form"]
ssh = ["dep:russh", "dep:dashmap"]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:serde_yaml", "dep:futures-executor"]
plot = ["dep:plotters"]

[dependencies]
flashmind-types = { workspace = true }
flashmind-core = { workspace = true, optional = true }
flashmind-skills = { workspace = true, optional = true }

tokio = { workspace = true, features = ["sync", "time", "process", "fs", "io-util", "rt", "macros"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["charset", "json", "query", "rustls-no-provider", "stream"] }
webpki-roots = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
chrono = { workspace = true }
regex = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
glob = { workspace = true }
similar = "3"
dashmap = { version = "6", optional = true }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
dirs = "7"
futures-util = { workspace = true }
futures-executor = { version = "0.3", optional = true }
rmcp = { version = "3.5", optional = true, default-features = false, features = ["client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
jsonwebtoken = { version = "11", optional = true, features = ["rust_crypto"] }
urlencoding = { version = "2", optional = true }
quick-xml = { version = "0.42", optional = true }
redis = { version = "0.29", optional = true, features = ["tokio-comp", "aio"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
mysql_async = { version = "0.37", optional = true, default-features = false, features = ["default-rustls-ring"] }
bollard = { version = "0.21", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
russh = { version = "0.64", optional = true }
kube = { version = "4.2", optional = true, default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.28", optional = true, features = ["latest"] }
serde_yaml = { workspace = true, optional = true }
plotters = { version = "0.3", optional = true, default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "area_series", "ttf"] }
ratelimit = { workspace = true, optional = true }
rust_decimal = { workspace = true }
rusqlite = { workspace = true, optional = true }
strum = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rsa = "0.9"
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }
ctor = "0.4"
