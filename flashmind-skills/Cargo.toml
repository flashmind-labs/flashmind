[package]
name = "flashmind-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Skill discovery, loading, and execution for Flashmind"
license = "MIT"
repository = "https://github.com/flashmind-labs/flashmind"
homepage = "https://github.com/flashmind-labs/flashmind"
documentation = "https://docs.rs/flashmind-skills"
keywords = ["ai", "agent", "skills", "tools"]
categories = ["development-tools"]
exclude = ["CLAUDE.md"]

[features]
default = []
full = []

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
tokio = { version = "1", features = ["process", "fs", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
