[package]
name = "flashmind-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Skill discovery, loading, and execution for Flashmind"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-skills"
keywords = ["ai", "agent", "skills", "tools"]
categories = ["development-tools"]
exclude.workspace = true

[features]
default = []
full = []

[dependencies]
flashmind-types = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "time", "sync", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
