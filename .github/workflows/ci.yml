name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.91", stable]
    steps:
      - uses: actions/checkout@v7
      - name: Install plotting dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy, rust-analyzer, rust-src
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p flashmind-memory --no-default-features --features session
      - run: cargo test -p flashmind-memory --no-default-features --features sqlite
      - run: cargo check -p flashmind-tools --no-default-features
      - run: cargo check -p flashmind-tui --no-default-features
      - run: cargo test -p flashmind --no-default-features --features core,llm
      - run: cargo test -p flashmind --features full
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install plotting dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build docs.rs documentation
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: |
          packages=$(cargo metadata --format-version 1 --no-deps |
            jq -r '.packages[] | select(any(.targets[]; .kind | index("lib"))) | .name')
          for package in $packages; do
            cargo doc -p "$package" --all-features --no-deps --locked
          done
      - name: Check documentation examples
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo test --workspace --all-features --doc --locked
