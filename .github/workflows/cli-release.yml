name: CLI release
on:
  push:
    # Builds on main keep a warm cache per target: a cache saved by a tag run
    # is only visible to that tag, but main's caches are visible to all runs.
    branches: [main]
    tags: ['flashmind-cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI release tag
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: flsh }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: flsh }
          # Built in Alpine, where musl is the native libc, for Alpine and other
          # musl systems.
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, binary: flsh, alpine: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, binary: flsh, alpine: true }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, binary: flsh }
          - { runner: macos-15, target: aarch64-apple-darwin, binary: flsh }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, binary: flsh.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "flashmind-cli"))')
          if [ '${{ github.ref }}' != refs/heads/main ] || [ -n '${{ inputs.tag }}' ]; then
            test "$RELEASE_TAG" = "flashmind-cli-v$version"
          fi
          if [ '${{ matrix.alpine }}' = true ]; then
            # Root in the container owns what it writes; hand target/ and the
            # registry back to the runner so the cache step can read and prune them.
            mkdir -p "$HOME/.cargo/registry"
            docker run --rm -v "$PWD":/src -v "$HOME/.cargo/registry":/usr/local/cargo/registry -w /src rust:alpine \
              sh -c "apk add --no-cache musl-dev cmake make perl clang \
                && cargo build --release -p flashmind-cli --target '${{ matrix.target }}'; \
                status=\$?; chown -R $(id -u):$(id -g) target /usr/local/cargo/registry; exit \$status"
          else
            cargo build --release -p flashmind-cli --target '${{ matrix.target }}'
          fi
          mkdir dist
          suffix=''
          if [[ '${{ matrix.binary }}' == *.exe ]]; then suffix=.exe; fi
          cp 'target/${{ matrix.target }}/release/${{ matrix.binary }}' "dist/flsh-${{ matrix.target }}$suffix"
          python -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); p.with_name(p.name+".sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"\n")' "dist/flsh-${{ matrix.target }}$suffix"
      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main' || inputs.tag != ''
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    if: github.ref != 'refs/heads/main' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Publish to R2
        env:
          CF_ENDPOINT: ${{ secrets.CF_ENDPOINT }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_BUCKET: ${{ secrets.CF_BUCKET }}
        run: |
          set -euo pipefail
          : "${CF_ENDPOINT:?Missing CF_ENDPOINT}" "${CF_ACCESS_KEY_ID:?Missing CF_ACCESS_KEY_ID}" "${CF_SECRET_ACCESS_KEY:?Missing CF_SECRET_ACCESS_KEY}" "${CF_BUCKET:?Missing CF_BUCKET}"
          version=${RELEASE_TAG#flashmind-cli-v}
          upload() {
            local file=$1 key=$2 content_type=$3
            curl -fsS --retry 3 --aws-sigv4 'aws:amz:auto:s3' \
              --user "$CF_ACCESS_KEY_ID:$CF_SECRET_ACCESS_KEY" \
              -H "x-amz-content-sha256: $(sha256sum "$file" | cut -d ' ' -f 1)" \
              -H 'Cache-Control: no-cache' -H "Content-Type: $content_type" \
              -T "$file" "$CF_ENDPOINT/$CF_BUCKET/flashmind/cli/$key" > /dev/null
          }
          for file in dist/*; do upload "$file" "$version/${file##*/}" application/octet-stream; done
          upload flashmind-cli/install.sh install.sh 'text/plain; charset=utf-8'
          upload flashmind-cli/install.ps1 install.ps1 'text/plain; charset=utf-8'
          printf '%s\n' "$version" > latest.txt
          upload latest.txt latest.txt 'text/plain; charset=utf-8'
  image:
    needs: build
    if: github.ref != 'refs/heads/main' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Not the release tag: a manual run for a tag older than docker/ still
      # needs the Dockerfile.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*-linux-gnu
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#flashmind-cli-v}
          image=ghcr.io/${{ github.repository_owner }}/flsh
          tags=(--tag "$image:$version")
          # A manual rerun of an older tag must not move latest.
          if [ '${{ github.event_name }}' = push ]; then tags+=(--tag "$image:latest"); fi
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$version" \
            "${tags[@]}" \
            -f docker/Dockerfile dist
