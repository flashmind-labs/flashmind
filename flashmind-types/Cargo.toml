[package]
name = "flashmind-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared types for the Flashmind AI agent framework"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-types"
keywords = ["ai", "agent", "llm", "types"]
categories = ["api-bindings", "data-structures"]
exclude.workspace = true

[features]
default = []
full = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
derive_more = { workspace = true }
strum = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
async-stream = { workspace = true }
rust_decimal_macros = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
