[package]
name = "flashmind-cron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Cron job scheduling with pluggable storage for Flashmind"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-cron"
keywords = ["ai", "agent", "cron", "scheduler"]
categories = ["date-and-time", "development-tools"]
exclude.workspace = true

[features]
default = []
full = []

[dependencies]
flashmind-types = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
uuid = { workspace = true, features = ["serde"] }
nom = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
