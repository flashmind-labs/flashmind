[package]
name = "flashmind-cron"
version = "0.1.0"
edition = "2024"
description = "Cron job scheduling with pluggable storage for Flashmind"
license = "MIT"

[features]
default = []
all = []

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
nom = "8"
tracing = "0.1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
