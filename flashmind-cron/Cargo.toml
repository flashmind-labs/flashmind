[package]
name = "flashmind-cron"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cron job scheduling with pluggable storage for Flashmind"
license = "MIT"
repository = "https://github.com/flashmind-labs/flashmind"
homepage = "https://github.com/flashmind-labs/flashmind"
documentation = "https://docs.rs/flashmind-cron"
keywords = ["ai", "agent", "cron", "scheduler"]
categories = ["date-and-time", "development-tools"]
exclude = ["CLAUDE.md"]

[features]
default = []
full = []

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
nom = "8"
tracing = "0.1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
