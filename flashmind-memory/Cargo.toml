[package]
name = "flashmind-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Vector memory store with hybrid search"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-memory"
keywords = ["ai", "agent", "memory", "sqlite", "postgres"]
categories = ["database", "development-tools"]
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["sqlite", "http-embeddings", "http-compression", "http2"]
full = ["sqlite", "session-sqlite", "session-sqlite-import", "http-embeddings", "http-compression", "http2"]
sqlite = [
    "dep:rusqlite", "dep:sqlite-vec", "dep:tokio-rusqlite", "dep:metrics",
    "dep:futures-util", "dep:flashmind-types", "dep:tokio", "dep:chrono",
    "dep:tracing", "dep:uuid", "dep:anyhow",
]
session = ["dep:sha2", "dep:flashmind-types", "dep:tokio", "dep:chrono", "dep:serde_json", "dep:anyhow", "dep:uuid", "uuid/serde"]
session-sqlite = ["dep:flashmind-types", "dep:tokio", "tokio/fs", "dep:chrono", "dep:serde_json", "dep:anyhow", "dep:rusqlite", "dep:tokio-rusqlite"]
session-sqlite-import = ["session", "dep:rusqlite", "rusqlite/backup", "dep:tokio-rusqlite"]
postgres = [
    "dep:sqlx", "dep:pgvector", "dep:metrics", "dep:futures-util",
    "dep:flashmind-types", "dep:tokio", "dep:chrono", "dep:tracing",
    "dep:uuid", "dep:anyhow",
]
http-embeddings = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:url", "dep:tokio", "dep:serde_json", "dep:tracing", "dep:anyhow"]
http-compression = ["reqwest?/gzip"]
http2 = ["reqwest?/http2"]

[dependencies]
sha2 = { workspace = true, optional = true }
flashmind-types = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sqlite-vec = { workspace = true, optional = true }
tokio-rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync", "macros"] }
reqwest = { workspace = true, optional = true, features = ["charset", "json", "rustls-no-provider"] }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
url = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
