[package]
name = "flashmind-memory"
version = "0.1.0"
edition = "2024"
description = "Vector memory store with hybrid search"
license = "MIT"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1"
tokio-rusqlite = "0.7"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
metrics = "0.24"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
flashmind-types = { version = "0.1", path = "../flashmind-types" }
strum = { version = "0.28", default-features = false, features = ["derive"] }
url = "2"
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
