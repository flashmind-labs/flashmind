[package]
name = "flashmind-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Vector memory store with hybrid search"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-memory"
keywords = ["ai", "agent", "memory", "sqlite", "postgres"]
categories = ["database", "development-tools"]
exclude.workspace = true

[features]
default = ["sqlite", "http-embeddings"]
full = ["sqlite", "session", "http-embeddings"]
sqlite = ["dep:rusqlite", "dep:sqlite-vec", "dep:tokio-rusqlite"]
session = ["dep:rusqlite", "dep:tokio-rusqlite"]
postgres = ["dep:sqlx", "dep:pgvector"]
http-embeddings = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:url"]

[dependencies]
flashmind-types = { workspace = true }
rusqlite = { workspace = true, optional = true }
sqlite-vec = { workspace = true, optional = true }
tokio-rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
reqwest = { workspace = true, optional = true, features = ["charset", "gzip", "http2", "json", "rustls-no-provider"] }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true, optional = true }
futures = { workspace = true }
sqlx = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
