[package]
name = "flashmind-core"
version = "0.1.0"
edition = "2024"
description = "Core agent runtime for the Flashmind AI assistant"
license = "MIT"

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }

tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs"] }
tokio-util = "0.7"
futures = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
metrics = "0.24"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
rust_decimal = { version = "1.40", features = ["serde-float"] }
rust_decimal_macros = "1.40"
base64 = "0.22"

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
