# cargo-release configuration
# Install: cargo install cargo-release
#
# Usage:
#   cargo release patch --workspace --execute    # bump all crates 0.1.0 → 0.1.1
#   cargo release minor --workspace --execute    # bump all crates 0.1.0 → 0.2.0
#   cargo release -p flashmind-core patch --execute  # bump one crate + update dependents
#
# Dry run (default, no --execute):
#   cargo release patch --workspace

# When a crate's version is bumped, update all workspace crates that depend on it
# to require the new version. This is the key setting.
dependent-version = "upgrade"

# Also bump the version requirement in [workspace.dependencies]
allow-branch = ["main"]
sign-commit = false
sign-tag = false
push = true
publish = true
tag = true

# Use shared tag format for workspace releases
tag-prefix = ""
tag-name = "v{{version}}"
consolidate-commits = true
