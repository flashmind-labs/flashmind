# Dry run: cargo release --workspace
# Publish current versions: cargo release --workspace --execute
# Bump and publish: cargo release patch --workspace --execute
# First-time publication may require batches under crates.io rate limits.
dependent-version = "upgrade"
shared-version = true

allow-branch = ["main"]
sign-commit = false
sign-tag = false
push = true
publish = true
tag = true

tag-prefix = ""
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
consolidate-commits = true
