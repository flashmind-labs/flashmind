[package]
name = "flashmind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AI agent framework for building, composing, and running LLM-powered agents in Rust"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind"
keywords = ["ai", "agent", "llm", "tools", "mcp"]
categories = ["development-tools"]
exclude.workspace = true

[features]
default = ["core", "llm"]
full = [
    "core",
    "llm",
    "tools",
    "memory",
    "prompts",
    "cron",
    "skills",
    "tailscale",
    "tui",
    "session",
    "mcp",
    "gmail",
    "google-calendar",
    "google-contacts",
    "outlook",
    "caldav",
    "github",
    "slack",
    "composio",
    "flashmind-types/full",
    "flashmind-llm/full",
    "flashmind-core/full",
    "flashmind-tools/full",
    "flashmind-memory/full",
    "flashmind-cron/full",
    "flashmind-skills/full",
    "flashmind-tailscale/full",
    "flashmind-tui/full",
    "flashmind-prompts/full",
]
core = ["dep:flashmind-core"]
llm = ["dep:flashmind-llm"]
tools = ["core", "dep:flashmind-tools"]
memory = ["dep:flashmind-memory"]
prompts = ["dep:flashmind-prompts"]
cron = ["dep:flashmind-cron"]
skills = ["dep:flashmind-skills"]
tailscale = ["dep:flashmind-tailscale"]
tui = ["dep:flashmind-tui"]
session = ["memory", "flashmind-memory/session"]
mcp = ["tools", "flashmind-tools/mcp"]
gmail = ["tools", "flashmind-tools/gmail"]
google-calendar = ["tools", "flashmind-tools/google-calendar"]
google-contacts = ["tools", "flashmind-tools/google-contacts"]
outlook = ["tools", "flashmind-tools/outlook"]
caldav = ["tools", "flashmind-tools/caldav"]
github = ["tools", "flashmind-tools/github"]
slack = ["tools", "flashmind-tools/slack"]
composio = ["tools", "flashmind-tools/composio"]

[dependencies]
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true, optional = true }
flashmind-core = { workspace = true, optional = true }
flashmind-tools = { workspace = true, optional = true }
flashmind-memory = { workspace = true, optional = true }
flashmind-prompts = { workspace = true, optional = true }
flashmind-cron = { workspace = true, optional = true }
flashmind-skills = { workspace = true, optional = true }
flashmind-tailscale = { workspace = true, optional = true }
flashmind-tui = { workspace = true, features = ["markdown"], optional = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[[example]]
name = "composio"
required-features = ["composio"]

[[example]]
name = "command_approval"
required-features = ["tools"]

[[example]]
name = "mcp"
required-features = ["mcp"]

[[example]]
name = "subagents"
required-features = ["tools"]

[dev-dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
home = "0.5"
flashmind-tui = { workspace = true, features = ["markdown"] }
futures = { workspace = true }
ratatui = { workspace = true }
ratelimit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
