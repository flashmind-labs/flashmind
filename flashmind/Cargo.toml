[package]
name = "flashmind"
version = "0.1.0"
edition = "2024"
description = "AI agent framework — build, compose, and run LLM-powered agents in Rust"
license = "MIT"

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
flashmind-llm = { version = "0.1", path = "../flashmind-llm" }
flashmind-core = { version = "0.1", path = "../flashmind-core" }
flashmind-tools = { version = "0.1", path = "../flashmind-tools" }
flashmind-memory = { version = "0.1", path = "../flashmind-memory" }
flashmind-prompts = { version = "0.1", path = "../flashmind-prompts" }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ratelimit = "2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
