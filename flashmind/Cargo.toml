[package]
name = "flashmind"
version = "0.1.0"
edition = "2024"
description = "AI agent framework — build, compose, and run LLM-powered agents in Rust"
license = "MIT"

[features]
default = []
full = [
    "tui",
    "session",
    "flashmind-types/full",
    "flashmind-llm/full",
    "flashmind-core/full",
    "flashmind-tools/full",
    "flashmind-memory/full",
    "flashmind-cron/full",
    "flashmind-skills/full",
    "flashmind-tailscale/full",
    "flashmind-tui/full",
    "flashmind-prompts/full",
]
tui = ["dep:flashmind-tui"]
session = ["flashmind-memory/session"]

[dependencies]
flashmind-types = { version = "0.1", path = "../flashmind-types" }
flashmind-llm = { version = "0.1", path = "../flashmind-llm" }
flashmind-core = { version = "0.1", path = "../flashmind-core" }
flashmind-tools = { version = "0.1", path = "../flashmind-tools" }
flashmind-memory = { version = "0.1", path = "../flashmind-memory" }
flashmind-prompts = { version = "0.1", path = "../flashmind-prompts" }
flashmind-cron = { version = "0.1", path = "../flashmind-cron" }
flashmind-skills = { version = "0.1", path = "../flashmind-skills" }
flashmind-tailscale = { version = "0.1", path = "../flashmind-tailscale" }
flashmind-tui = { version = "0.1", path = "../flashmind-tui", features = ["markdown"], optional = true }
anyhow = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
home = "0.5"
flashmind-tui = { version = "0.1", path = "../flashmind-tui", features = ["markdown"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
ratelimit = "2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
