[package]
name = "flashmind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AI agent framework for building, composing, and running LLM-powered agents in Rust"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind"
keywords = ["ai", "agent", "llm", "tools", "mcp"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["core", "llm", "sqlite", "mistral-realtime", "http-compression", "http2", "request-compression", "markdown", "clipboard", "tool-http", "tool-skills", "subagent"]
full = [
    "core",
    "llm",
    "sqlite",
    "tools",
    "subagent",
    "memory",
    "prompts",
    "cron",
    "skills",
    "tailscale",
    "tui",
    "session-sqlite",
    "session-sqlite-import",
    "mcp",
    "gmail",
    "google-calendar",
    "google-contacts",
    "outlook",
    "caldav",
    "github",
    "slack",
    "composio",
    "lsp",
    "flashmind-types/full",
    "flashmind-llm/full",
    "flashmind-core/full",
    "flashmind-tools/full",
    "flashmind-memory/full",
    "flashmind-cron/full",
    "flashmind-skills/full",
    "flashmind-tailscale/full",
    "flashmind-tui/full",
    "flashmind-prompts/full",
]
core = ["dep:flashmind-core"]
llm = ["dep:flashmind-llm"]
tools = ["dep:flashmind-tools"]
subagent = ["flashmind-core?/subagent", "flashmind-tools?/subagent"]
memory = ["dep:flashmind-memory", "flashmind-memory/http-embeddings"]
# SQLite storage for `memory` and the `sqlite_query` tool for `tools`.
sqlite = ["flashmind-memory?/sqlite", "flashmind-tools?/sqlite"]
memory-postgres = ["memory", "flashmind-memory/postgres"]
prompts = ["dep:flashmind-prompts"]
cron = ["dep:flashmind-cron"]
skills = ["dep:flashmind-skills"]
tailscale = ["dep:flashmind-tailscale"]
tui = ["dep:flashmind-tui"]
session = ["dep:flashmind-memory", "flashmind-memory/session"]
session-sqlite = ["dep:flashmind-memory", "flashmind-memory/session-sqlite"]
session-sqlite-import = ["session", "flashmind-memory/session-sqlite-import"]
mistral-realtime = ["flashmind-llm?/mistral-realtime"]
http-compression = ["flashmind-llm?/http-compression", "flashmind-tools?/http-compression", "flashmind-memory?/http-compression"]
http2 = ["flashmind-llm?/http2", "flashmind-tools?/http2", "flashmind-memory?/http2"]
request-compression = ["flashmind-llm?/request-compression"]
markdown = ["flashmind-tui?/markdown"]
clipboard = ["flashmind-tui?/clipboard"]
tool-http = ["flashmind-tools?/http"]
tool-skills = ["flashmind-tools?/skills"]
mcp = ["tools", "flashmind-tools/mcp"]
gmail = ["tools", "flashmind-tools/gmail"]
google-calendar = ["tools", "flashmind-tools/google-calendar"]
google-contacts = ["tools", "flashmind-tools/google-contacts"]
outlook = ["tools", "flashmind-tools/outlook"]
caldav = ["tools", "flashmind-tools/caldav"]
github = ["tools", "flashmind-tools/github"]
slack = ["tools", "flashmind-tools/slack"]
composio = ["tools", "flashmind-tools/composio"]
lsp = ["tools", "flashmind-tools/lsp"]

[dependencies]
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true, optional = true }
flashmind-core = { workspace = true, optional = true }
flashmind-tools = { workspace = true, optional = true }
flashmind-memory = { workspace = true, optional = true }
flashmind-prompts = { workspace = true, optional = true }
flashmind-cron = { workspace = true, optional = true }
flashmind-skills = { workspace = true, optional = true }
flashmind-tailscale = { workspace = true, optional = true }
flashmind-tui = { workspace = true, optional = true }

[[example]]
name = "composio"
required-features = ["composio"]

[[example]]
name = "command_approval"
required-features = ["core", "tools"]

[[example]]
name = "embedding_calculator"
required-features = ["memory", "sqlite"]

[[example]]
name = "mcp"
required-features = ["core", "mcp", "llm", "tui"]

[[example]]
name = "subagents"
required-features = ["core", "tools", "llm", "subagent"]

[[example]]
name = "custom_tool"
required-features = ["core"]

[[example]]
name = "streaming"
required-features = ["core"]

[[example]]
name = "ollama"
required-features = ["core", "llm"]

[[example]]
name = "openai_compat"
required-features = ["core", "llm"]

[[example]]
name = "tui_repl"
required-features = ["core", "llm", "tui"]

[[example]]
name = "widgets"
required-features = ["tui"]

[[example]]
name = "image_edit"
required-features = ["llm"]

[[example]]
name = "image_gen"
required-features = ["llm"]

[[example]]
name = "jev"
required-features = ["llm"]

[[example]]
name = "list_models"
required-features = ["llm"]

[[example]]
name = "video_gen"
required-features = ["llm"]

[dev-dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
home = "0.5"
futures = { workspace = true }
nom = { workspace = true }
ratatui = { workspace = true }
secrecy = "0.10"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
