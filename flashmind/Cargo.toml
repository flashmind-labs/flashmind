[package]
name = "flashmind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AI agent framework — build, compose, and run LLM-powered agents in Rust"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind"
keywords = ["ai", "agent", "llm", "tools"]
categories = ["development-tools"]
exclude.workspace = true

[features]
default = []
full = [
    "tui",
    "session",
    "mcp",
    "gmail",
    "google-calendar",
    "google-contacts",
    "outlook",
    "caldav",
    "github",
    "slack",
    "composio",
    "flashmind-types/full",
    "flashmind-llm/full",
    "flashmind-core/full",
    "flashmind-tools/full",
    "flashmind-memory/full",
    "flashmind-cron/full",
    "flashmind-skills/full",
    "flashmind-tailscale/full",
    "flashmind-tui/full",
    "flashmind-prompts/full",
]
tui = ["dep:flashmind-tui"]
session = ["flashmind-memory/session"]
mcp = ["flashmind-tools/mcp"]
gmail = ["flashmind-tools/gmail"]
google-calendar = ["flashmind-tools/google-calendar"]
google-contacts = ["flashmind-tools/google-contacts"]
outlook = ["flashmind-tools/outlook"]
caldav = ["flashmind-tools/caldav"]
github = ["flashmind-tools/github"]
slack = ["flashmind-tools/slack"]
composio = ["flashmind-tools/composio"]

[dependencies]
flashmind-types = { workspace = true }
flashmind-llm = { workspace = true }
flashmind-core = { workspace = true }
flashmind-tools = { workspace = true }
flashmind-memory = { workspace = true }
flashmind-prompts = { workspace = true }
flashmind-cron = { workspace = true }
flashmind-skills = { workspace = true }
flashmind-tailscale = { workspace = true }
flashmind-tui = { workspace = true, features = ["markdown"], optional = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[[example]]
name = "composio"
required-features = ["composio"]

[[example]]
name = "mcp"
required-features = ["mcp"]

[dev-dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
home = "0.5"
flashmind-tui = { workspace = true, features = ["markdown"] }
futures = { workspace = true }
ratatui = { workspace = true }
ratelimit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true }
