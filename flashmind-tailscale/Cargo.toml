[package]
name = "flashmind-tailscale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tailscale local API client and Funnel helpers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flashmind-tailscale"
keywords = ["tailscale", "funnel", "networking"]
categories = ["api-bindings", "network-programming"]
exclude.workspace = true

[features]
default = []
full = []

[dependencies]
tokio = { workspace = true, features = ["process", "sync", "net", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
bytes = { workspace = true }
home = "0.5"
